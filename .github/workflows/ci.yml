name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: CLI runs
        run: |
          node dist/cli.js --version
          node dist/cli.js --help > /dev/null
          # An unrecognized ID must exit 2 without a network call.
          node dist/cli.js "not an id" || test $? -eq 2
